# Usage: cp .env.example .env (set SECRET_KEY, POSTGRES_PASSWORD, Turnstile keys), then
#   docker compose up -d --build
#   docker compose exec web flask create-admin <username>
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: medform
      POSTGRES_USER: medform_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medform_app -d medform"]
      interval: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Overrides any DATABASE_URL in .env so the app talks to the db container.
      DATABASE_URL: postgresql+psycopg://medform_app:${POSTGRES_PASSWORD}@db:5432/medform
    ports:
      - "${BIND:-127.0.0.1:8002}:8000"   # point the reverse proxy here

volumes:
  pgdata:
