# Uses an existing external Postgres (set DATABASE_URL in .env).
# Usage: cp .env.example .env (set SECRET_KEY, DATABASE_URL, Turnstile keys), then
#   docker compose up -d --build
#   docker compose exec medform flask create-admin <username>
services:
  medform:
    build: .
    container_name: medform
    restart: unless-stopped
    env_file: .env
    ports:
      - "8002:8000"   # point the reverse proxy here
