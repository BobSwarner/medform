<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Medication and Doctor Information{% endblock %} · Swarner Consulting LLC</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
</head>
<body>
  <header class="site-header">
    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Swarner Consulting LLC – Health Insurance and Medicare" width="120" height="120">
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">&copy; 2026 Swarner Consulting LLC</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
